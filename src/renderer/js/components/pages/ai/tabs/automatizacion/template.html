<div id="section-ai-automatizacion" class="ai-card animate-fade-in">
    <div class="card glass-card">
        <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 20px;">
            <span class="material-icons-outlined" style="color: var(--primary)">bolt</span>
            Automatización de Respuestas
        </label>
        
        <div class="status-row">
            <span class="material-icons-outlined" style="color: var(--primary); font-size: 1.25rem;">info</span>
            <span style="font-size: 0.85rem; line-height: 1.5;">La IA responderá de forma automática a los mensajes entrantes de clientes desconocidos.</span>
        </div>
        
        <div class="ai-toggle-footer" style="border: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 20px;">
            <div class="header-left" style="display: flex; align-items: center; gap: 15px;">
                <strong>Activar Auto-Respuesta:</strong>
                <input type="checkbox" id="ai-auto-reply" style="width: 22px; height: 22px; cursor: pointer;">
            </div>
            
            <div style="width: 100%; padding-top: 25px; border-top: 1px solid rgba(255, 255, 255, 0.05); display: flex; justify-content: center;">
                <button id="btn-save-automation" class="btn btn-success" style="padding: 12px 50px; min-width: 250px;">
                     <span class="material-icons-outlined">save</span> GUARDAR CAMBIOS DE AUTOMATIZACIÓN
                </button>
            </div>
        </div>
    </div>
</div>
