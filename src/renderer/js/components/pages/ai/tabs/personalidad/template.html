<div id="section-ai-personalidad" class="ai-card animate-fade-in">
    <div class="card glass-card">
        <div class="form-group-col">
            
            <!-- PARTE 1: INSTRUCCIONES MAESTRAS -->
            <div class="input-field">
                <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
                    <span class="material-icons-outlined" style="color: var(--primary)">psychology</span>
                    Identidad y Perfil de la IA
                </label>
                
                <div class="status-row">
                    <span class="material-icons-outlined" style="color: var(--primary); font-size: 1.25rem;">info</span>
                    <span style="font-size: 0.85rem; line-height: 1.5;">Define quién es la IA y cómo debe expresarse. Este es el "cerebro" que orquestará todas las respuestas.</span>
                </div>

                <!-- MINI-MAGO MODULAR: PERSONALIDAD -->
                <div style="margin-bottom: 20px; padding: 15px; background: rgba(34, 197, 94, 0.03); border-radius: 8px; border: 1px dashed rgba(34, 197, 94, 0.2);">
                    <label style="display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; color: var(--primary);">
                        <span class="material-icons-outlined" style="font-size: 1rem;">auto_awesome</span> 
                        ¿Cómo quieres que sea tu IA? (Instrucciones para generar)
                    </label>
                    <textarea id="ai-context-personalidad" class="prompt-area" style="min-height: 60px; font-size: 0.85rem;" 
                        placeholder="Ej: Un vendedor de coches experto, muy educado, que usa un tono profesional pero cercano y siempre intenta cerrar una cita de prueba."></textarea>
                </div>

                <textarea id="ai-system-prompt" class="prompt-area" style="min-height: 300px; margin-bottom: 20px;" placeholder="Ejemplo: Eres un asistente experto en ventas, amable, profesional y usas un tono cercano."></textarea>
            </div>

            <!-- BOTONES DE ACCIÓN -->
            <div style="display: flex; justify-content: center; gap: 15px; margin-top: 35px; padding-top: 25px; border-top: 1px solid rgba(255, 255, 255, 0.05);">
                <button id="btn-generate-prompt" class="btn btn-primary" style="padding: 12px 30px; min-width: 200px; background: var(--secondary)">
                    <span class="material-icons-outlined">auto_awesome</span> GENERAR IDENTIDAD
                </button>
                <button id="btn-save-prompt" class="btn btn-success" style="padding: 12px 30px; min-width: 200px;">
                    <span class="material-icons-outlined">save</span> GUARDAR IDENTIDAD
                </button>
            </div>
        </div>
    </div>
</div>
