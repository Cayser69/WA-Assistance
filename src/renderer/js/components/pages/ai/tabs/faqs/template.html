<div id="section-ai-faqs" class="ai-card animate-fade-in">
    <div class="card glass-card">
        <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 20px;">
            <span class="material-icons-outlined" style="color: var(--primary)">quiz</span>
            Preguntas Frecuentes (FAQs)
        </label>

        <div class="status-row">
            <span class="material-icons-outlined" style="color: var(--primary); font-size: 1.25rem;">info</span>
            <span style="font-size: 0.85rem; line-height: 1.5;">Anticípate a las dudas de tus clientes. Cuantas más respuestas proporciones aquí, más autónoma será la IA.</span>
        </div>

        <div class="form-group-col">
            <!-- MINI-MAGO MODULAR: FAQs -->
            <div style="margin-bottom: 20px; padding: 15px; background: rgba(34, 197, 94, 0.03); border-radius: 8px; border: 1px dashed rgba(34, 197, 94, 0.2);">
                <label style="display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; color: var(--primary);">
                    <span class="material-icons-outlined" style="font-size: 1rem;">auto_awesome</span> 
                    ¿Qué dudas suelen tener? (Instrucciones para generar FAQs)
                </label>
                <textarea id="ai-context-faqs" class="prompt-area" style="min-height: 60px; font-size: 0.85rem;" 
                    placeholder="Ej: Somos una clínica dental, preguntan mucho por el precio de los implantes, si aceptamos seguros y el horario de urgencias fines de semana."></textarea>
            </div>

            <div class="input-field">
                <textarea id="ai-kb-faqs" class="prompt-area" style="min-height: 300px;" placeholder="Ejemplo:
P: ¿Tienen tienda física?
R: Sí, estamos en Calle Principal 123.

P: ¿Aceptan devoluciones?
R: Sí, tienes 30 días para cambios."></textarea>
            </div>

            <!-- BOTONES DE ACCIÓN -->
            <div style="display: flex; justify-content: center; gap: 15px; margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.05);">
                <button id="btn-generate-faqs" class="btn btn-primary" style="padding: 12px 30px; min-width: 200px; background: var(--secondary)">
                    <span class="material-icons-outlined">auto_awesome</span> GENERAR FAQs
                </button>
                <button id="btn-save-faqs" class="btn btn-success" style="padding: 12px 30px; min-width: 200px;">
                    <span class="material-icons-outlined">save</span> GUARDAR PREGUNTAS
                </button>
            </div>
        </div>
    </div>
</div>
