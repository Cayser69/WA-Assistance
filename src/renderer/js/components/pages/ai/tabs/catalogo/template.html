<div id="section-ai-catalogo" class="ai-card animate-fade-in">
    <div class="card glass-card">
        <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 20px;">
            <span class="material-icons-outlined" style="color: var(--primary)">shopping_bag</span>
            Catálogo de Productos y Servicios
        </label>

        <div class="status-row">
            <span class="material-icons-outlined" style="color: var(--primary); font-size: 1.25rem;">info</span>
            <span style="font-size: 0.85rem; line-height: 1.5;">Describe tus productos, precios y características principales. Esta información es vital para que la IA pueda vender por ti.</span>
        </div>

        <div class="form-group-col">
            <div class="input-field">
                <textarea id="ai-kb-catalogo" class="prompt-area" style="min-height: 400px;" placeholder="Ejemplo:
- Producto X: Beneficio Y, Precio $Z.
- Servicio A: Incluye B, C y D."></textarea>
            </div>

            <!-- BOTONES DE ACCIÓN -->
            <div style="display: flex; justify-content: center; gap: 15px; margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.05);">
                <button id="btn-generate-catalogo" class="btn btn-primary" style="padding: 12px 30px; min-width: 200px; background: var(--secondary)">
                    <span class="material-icons-outlined">auto_awesome</span> GENERAR CATÁLOGO
                </button>
                <button id="btn-save-catalogo" class="btn btn-success" style="padding: 12px 30px; min-width: 200px;">
                    <span class="material-icons-outlined">save</span> GUARDAR CATÁLOGO
                </button>
            </div>
        </div>
    </div>
</div>
