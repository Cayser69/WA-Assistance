<section id="chat-section" class="chat-container animate-fade-in">
    <div class="chat-layout">
        
        <!-- col-1: Sidebar (Contactos y Búsqueda) -->
        <aside class="chat-sidebar">
            <div class="search-box">
                <span class="material-icons-outlined">search</span>
                <input type="text" id="chat-search" placeholder="Buscar conversación...">
            </div>
            
            <div class="contacts-list" id="chat-contacts-list">
                <!-- Se inyecta dinámicamente desde parts/sidebar.js -->
            </div>
        </aside>

        <!-- col-2: Ventana de Chat (Mensajes) -->
        <main class="chat-window">
            
            <!-- Pantalla de Bienvenida (Estado inicial) -->
            <div id="chat-welcome-screen" class="welcome-screen">
                <span class="material-icons-outlined">chat</span>
                <h3>Tus Mensajes</h3>
                <p>Selecciona una conversación para ver el historial de mensajes y archivos multimedia.</p>
            </div>

            <!-- Vista de Conversación Activa -->
            <div id="chat-content-view" class="chat-content-view" style="display: none;">
                <header class="chat-header">
                    <div class="contact-info">
                        <div class="avatar">
                            <span class="material-icons-outlined">account_circle</span>
                        </div>
                        <div class="details">
                            <h4 id="active-chat-name">Cargando...</h4>
                            <span class="status-online">En línea</span>
                        </div>
                    </div>
                </header>

                <div class="messages-viewport" id="chat-messages-viewport">
                    <!-- Las burbujas de chat se inyectan desde parts/window.js -->
                </div>

                <footer class="chat-input-area">
                    <div class="input-container glass-card">
                        <button id="btn-chat-ai" class="btn-chat-action ai-sparkle" title="Asistente de Redacción IA">
                            <span class="material-icons-outlined">psychology</span>
                        </button>
                        
                        <textarea id="chat-input-text" placeholder="Escribe un mensaje..." rows="1"></textarea>
                        
                        <button id="btn-chat-send" class="btn-chat-send" title="Enviar Mensaje">
                            <span class="material-icons-outlined">send</span>
                        </button>
                    </div>
                </footer>
            </div>
        </main>
    </div>
</section>
