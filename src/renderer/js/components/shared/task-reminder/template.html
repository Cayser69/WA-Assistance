<div id="task-reminder-widget" class="card glass-card task-reminder-card">
    <div class="card-content">
        <div class="task-reminder-header">
            <h4>
                <span class="material-icons-outlined">notification_important</span> 
                Tarea Pendiente Detectada
            </h4>
            <button id="btn-reminder-close" class="btn-close-reminder" title="Cerrar aviso">
                <span class="material-icons-outlined">close</span>
            </button>
        </div>
        
        <div class="task-reminder-body">
            Parece que tienes un <span id="reminder-task-type" style="font-weight: 700; color: var(--secondary);">procesamiento</span> a medias. ¿Quieres continuar desde donde lo dejaste?
        </div>

        <div class="task-reminder-actions" style="display: flex; gap: 10px; justify-content: flex-end;">
            <button id="btn-reminder-discard" class="btn btn-secondary" style="font-size: 0.75rem; padding: 6px 12px;">
                <span class="material-icons-outlined" style="font-size: 1rem;">delete</span>
                DESCARTAR
            </button>
            <button id="btn-reminder-resume" class="btn btn-primary" style="font-size: 0.75rem; padding: 6px 16px;">
                <span class="material-icons-outlined" style="font-size: 1rem;">play_arrow</span>
                REANUDAR TAREA
            </button>
        </div>
    </div>
</div>
